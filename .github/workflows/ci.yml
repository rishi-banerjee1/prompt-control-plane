name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  release-surfaces:
    name: Release Surface Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Verify release and MCP Registry surfaces
        run: node scripts/check-release-surfaces.mjs

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Verify production tarball installation
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          install_dir="$RUNNER_TEMP/pcp-global"
          npm install --global --prefix "$install_dir" --omit=dev --no-audit --no-fund \
            "$RUNNER_TEMP/pcp-engine-$(node -p 'require("./package.json").version').tgz"
          "$install_dir/bin/pcp" --version
          "$install_dir/bin/pcp" optimize 'Review the authentication module and preserve its public API.' --json \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s);if(r.subcommand!=='optimize'||!r.compiled_prompt)process.exit(1);console.log('Global optimize smoke check passed')})"

  lint-and-audit:
    name: Security and Supply Chain Gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security gates
        run: npm run security:all

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json

      - name: Upload SBOM evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cyclonedx-sbom
          path: sbom.cdx.json
          retention-days: 90
