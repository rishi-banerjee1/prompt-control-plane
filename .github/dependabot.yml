version: 2

updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    reviewers:
      - "rishi-banerjee1"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps):"
    # Group minor/patch updates to reduce PR noise
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Video explainer dependencies
  - package-ecosystem: "npm"
    directory: "/video-explainer"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "rishi-banerjee1"
    labels:
      - "dependencies"
      - "video"
    commit-message:
      prefix: "chore(deps):"
    groups:
      video-security-updates:
        applies-to: security-updates
        patterns: ["*"]
      video-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      codeql:
        patterns: ["github/codeql-action/*"]
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "rishi-banerjee1"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci):"
